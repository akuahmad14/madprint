appId: com.example.madprint
---
# Jalankan dengan MAESTRO_EMAIL dan MAESTRO_PASSWORD yang disiapkan lokal.
- launchApp:
    clearState: true
- assertVisible: "MADprint"
- tapOn: "Email"
- inputText: "${MAESTRO_EMAIL}"
- tapOn: "Kata sandi"
- inputText: "${MAESTRO_PASSWORD}"
- tapOn: "Masuk"
# Dashboard menampilkan sapaan berbasis role (Halo, Admin).
- extendedWaitUntil:
    visible: "Halo, Admin"
    timeout: 20000
- assertVisible: "Home"
- assertVisible: "Pesanan"
- assertVisible: "Scan"
- assertVisible: "Profil"
- takeScreenshot: "02_admin_dashboard"
